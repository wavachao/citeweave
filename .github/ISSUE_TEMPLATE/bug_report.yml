name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include steps to reproduce and the expected behavior. Remove API keys and private URLs.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, GPU, driver, installation method, commit or release version.
    validations:
      required: true
